<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veganes Eis im Kugelpudel?</title>

  <style>
    :root {
      --bg-1: #fff7d6;
      --bg-2: #ffb7d5;
      --bg-3: #b8f7ff;
      --text: #211a1d;
      --muted: #6f5f66;
      --pink: #ff4fa3;
      --mint: #54e6b5;
      --yellow: #ffe36e;
      --purple: #8f6cff;
      --white: rgba(255, 255, 255, 0.72);
      --shadow: 0 24px 80px rgba(35, 20, 30, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 12% 18%, #fff36d 0 9%, transparent 26%),
        radial-gradient(circle at 86% 16%, #ff6fb7 0 8%, transparent 25%),
        radial-gradient(circle at 80% 84%, #5df0c8 0 10%, transparent 28%),
        radial-gradient(circle at 18% 82%, #9d7bff 0 9%, transparent 26%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
    }

    .blob {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 999px;
      filter: blur(8px);
      opacity: 0.34;
      pointer-events: none;
      animation: floaty 9s ease-in-out infinite;
    }

    .blob.one {
      left: -120px;
      top: 10%;
      background: var(--pink);
    }

    .blob.two {
      right: -120px;
      bottom: 8%;
      background: var(--mint);
      animation-delay: -3s;
    }

    .blob.three {
      right: 22%;
      top: -180px;
      background: var(--yellow);
      animation-delay: -5s;
    }

    @keyframes floaty {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(24px, -18px, 0) scale(1.08);
      }
    }

    .card {
      width: min(960px, 100%);
      min-height: min(720px, calc(100vh - 56px));
      position: relative;
      display: grid;
      place-items: center;
      padding: clamp(30px, 5vw, 72px);
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: clamp(28px, 4vw, 56px);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.82), rgba(255,255,255,0.44)),
        radial-gradient(circle at 18% 15%, rgba(255, 227, 110, 0.45), transparent 28%),
        radial-gradient(circle at 86% 22%, rgba(255, 79, 163, 0.30), transparent 30%),
        radial-gradient(circle at 80% 85%, rgba(84, 230, 181, 0.35), transparent 32%);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      overflow: hidden;
    }

    .sprinkle {
      position: absolute;
      width: 70px;
      height: 16px;
      border-radius: 999px;
      opacity: 0.72;
      transform: rotate(var(--r));
      pointer-events: none;
    }

    .s1 { top: 8%; left: 9%; background: var(--pink); --r: -18deg; }
    .s2 { top: 14%; right: 10%; background: var(--mint); --r: 22deg; }
    .s3 { bottom: 12%; left: 12%; background: var(--purple); --r: 16deg; }
    .s4 { bottom: 10%; right: 13%; background: var(--yellow); --r: -21deg; }
    .s5 { top: 50%; left: 3%; background: var(--yellow); --r: 72deg; }
    .s6 { top: 45%; right: 3%; background: var(--pink); --r: -68deg; }

    .content {
      width: min(700px, 100%);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      font-size: clamp(14px, 1.6vw, 18px);
      font-weight: 750;
      letter-spacing: 0.02em;
      box-shadow: 0 12px 30px rgba(35, 20, 30, 0.08);
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 8vw, 116px);
      line-height: 0.92;
      letter-spacing: -0.075em;
      text-wrap: balance;
    }

    .gradient {
      background: linear-gradient(90deg, #ff2f93, #8f6cff, #00b894);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .copy {
      width: min(560px, 100%);
      margin: 28px auto 0;
      font-size: clamp(18px, 2vw, 25px);
      line-height: 1.45;
      color: var(--muted);
    }

    .copy strong {
      color: var(--text);
    }

    .buttons {
      position: relative;
      width: min(520px, 100%);
      height: 190px;
      margin: 38px auto 0;
    }

    button {
      appearance: none;
      border: 0;
      font: inherit;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .yes {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      padding: 18px 34px;
      border-radius: 999px;
      background: #171214;
      color: white;
      font-size: 20px;
      font-weight: 850;
      box-shadow: 0 18px 42px rgba(23, 18, 20, 0.24);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .yes:active {
      transform: translateX(-50%) scale(0.96);
      box-shadow: 0 10px 28px rgba(23, 18, 20, 0.18);
    }

    .no {
      position: absolute;
      left: 50%;
      top: 96px;
      transform: translateX(-50%);
      padding: 14px 26px;
      border-radius: 999px;
      background: rgba(255,255,255,0.74);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.8);
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 14px 32px rgba(35, 20, 30, 0.12);
      transition:
        left 190ms cubic-bezier(.18,.89,.32,1.28),
        top 190ms cubic-bezier(.18,.89,.32,1.28),
        transform 160ms ease;
      touch-action: manipulation;
    }

    .no:active {
      transform: translateX(-50%) scale(0.94) rotate(-2deg);
    }

    .answer {
      min-height: 34px;
      margin-top: 16px;
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 850;
      color: var(--text);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .answer.show {
      opacity: 1;
      transform: translateY(0);
    }

    .footer {
      margin-top: 20px;
      color: rgba(33, 26, 29, 0.55);
      font-size: 14px;
      font-weight: 650;
    }

    @media (max-width: 620px) {
      body {
        padding: 16px;
      }

      .card {
        min-height: calc(100vh - 32px);
        border-radius: 34px;
        padding: 28px 20px;
      }

      .buttons {
        height: 230px;
        width: 100%;
      }

      .yes {
        font-size: 19px;
      }

      .no {
        font-size: 17px;
      }

      .sprinkle {
        width: 48px;
        height: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main class="card">
    <span class="sprinkle s1"></span>
    <span class="sprinkle s2"></span>
    <span class="sprinkle s3"></span>
    <span class="sprinkle s4"></span>
    <span class="sprinkle s5"></span>
    <span class="sprinkle s6"></span>

    <section class="content">
      <div class="eyebrow">🍦 kleine, wichtige Frage</div>

      <h1>
        Veganes Eis<br />
        im <span class="gradient">Kugelpudel?</span>
      </h1>

      <p class="copy">
        Hast du nächste Woche Lust auf eine Kugel, zwei Kugeln oder eine
        emotional absolut vertretbare Menge veganes Eis in Bochum?
      </p>

      <div class="buttons" id="buttonArea">
        <button class="yes" id="yesBtn" type="button">Ja, obviously</button>
        <button class="no" id="noBtn" type="button">Nein</button>
      </div>

      <div class="answer" id="answer">
        Awesome 😍 Ich warte auf deine Antwort in WhatsApp!
      </div>

      <div class="footer">
        Kugelpudel · Bochum · nächste Woche
      </div>
    </section>
  </main>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const answer = document.getElementById("answer");
    const buttonArea = document.getElementById("buttonArea");

    let noX = 50;
    let noY = 96;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function moveNoButton(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const areaRect = buttonArea.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = areaRect.width - btnRect.width / 2 - 12;
      const minX = btnRect.width / 2 + 12;

      const maxY = areaRect.height - btnRect.height - 10;
      const minY = 78;

      const distance = 90 + Math.random() * 70; // stronger movement: 90–160px
      const angle = Math.random() * Math.PI * 2;

      let nextX = noX + Math.cos(angle) * distance;
      let nextY = noY + Math.sin(angle) * distance;

      nextX = clamp(nextX, minX, maxX);
      nextY = clamp(nextY, minY, maxY);

      /*
        If the random movement hits an edge and barely moves,
        force it to the opposite side so every tap feels stronger.
      */
      const movedDistance = Math.hypot(nextX - noX, nextY - noY);

      if (movedDistance < 70) {
        nextX = noX < areaRect.width / 2 ? maxX : minX;
        nextY = clamp(noY + (Math.random() > 0.5 ? 120 : -120), minY, maxY);
      }

      noX = nextX;
      noY = nextY;

      noBtn.style.left = `${noX}px`;
      noBtn.style.top = `${noY}px`;
      noBtn.style.transform = "translateX(-50%) rotate(" + (Math.random() * 10 - 5) + "deg)";
    }

    /*
      Works on desktop and mobile.
      On mobile, pointerdown/touchstart fires as soon as the user presses “Nein”.
    */
    noBtn.addEventListener("pointerdown", moveNoButton);
    noBtn.addEventListener("touchstart", moveNoButton, { passive: false });
    noBtn.addEventListener("click", moveNoButton);

    yesBtn.addEventListener("click", () => {
      answer.classList.add("show");
      yesBtn.textContent = "Perfekt 🍦";
    });

    window.addEventListener("resize", () => {
      noX = 50;
      noY = 96;
      noBtn.style.left = "50%";
      noBtn.style.top = "96px";
      noBtn.style.transform = "translateX(-50%)";
    });
  </script>
</body>
</html>
